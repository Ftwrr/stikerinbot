name: Bun CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Verify Plugin Loader
      run: |
        bun -e "import('./lib/plugin_manager.js').then(async m => { const p = await m.loadPlugins(); if (!p || p.length === 0) process.exit(1); console.log('Plugins OK:', p.length); })"
